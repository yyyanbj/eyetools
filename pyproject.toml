[project]
name = "eyetools"
version = "0.1.0"
description = "MCP server with dynamic tool discovery and isolated execution"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.116.1,<1",
    "fastmcp==2.12.2",
    "loguru>=0.7.3,<1",
    "numpy>=2.2.6,<3",
    "pillow>=11.3,<13",
    "psutil>=7.1.3,<8",
    "pydantic>=2.11.7,<3",
    "python-dotenv>=1.1.1,<2",
    "python-multipart>=0.0.20,<1",
    "pyyaml>=6.0.2,<7",
    "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1,<1",
    "pytest>=8.4.2,<10",
]

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["eyetools*"]

[project.scripts]
eyetools-mcp = "eyetools.cli:main"
